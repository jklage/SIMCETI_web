<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Acceso</title>
    <link rel="stylesheet" href="style_docente.css">
</head>
<body>
    <div class="container">
        <div class="container-form login-panel">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm">
                <div class="container-input">
                    <ion-icon name="person-outline"></ion-icon>
                    <input type="text" id="username" name="username" required placeholder="Usuario">
                </div>
                <div class="container-input">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                    <input type="password" id="password" name="password" required placeholder="Contraseña">
                </div>
                <a href="#">¿Olvidaste tu contraseña?</a>
                <button class="btn" type="submit">Iniciar sesión</button>
            </form>
        </div>

        <div class="container-form register-panel">
            <h2>Registrarse</h2>
            <form id="registerForm">
                <div class="container-input">
                    <ion-icon name="person-outline"></ion-icon>
                    <input type="text" id="reg-username" name="username" required placeholder="Usuario">
                </div>
                <div class="container-input">
                    <ion-icon name="mail-outline"></ion-icon>
                    <input type="email" id="reg-email" name="email" required placeholder="Email">
                </div>
                <div class="container-input">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                    <input type="password" id="reg-password" name="password" required placeholder="Contraseña">
                </div>
                <button class="btn" type="submit">Registrarse</button>
            </form>
        </div>
    </div>

    <script src="script_docente.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

</body>
</html>
