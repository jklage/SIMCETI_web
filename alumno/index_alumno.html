<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Acceso</title>
    <link rel="stylesheet" href="/alumno/style_alumno.css">
</head>
<body>
    <img src="/elegir/CetiBckground.png" alt="Background" class="Background">
    <div class="container">
        <div class="container-form login-panel">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm">
                <div class="container-input">
                    <ion-icon name="person-outline"></ion-icon>
                    <input type="number" id="register" name="register" required placeholder="Registro">
                </div>
                <div class="container-input">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                    <input type="password" id="password" name="password" required placeholder="Contraseña">
                    <div class="seePsw">
                     <ion-icon name="eye-outline" class="iconOpen"></ion-icon>
                     <ion-icon name="eye-off-outline" class="iconClose"></ion-icon>
                    </div>
                </div>
                <a href="#" id="go-register">¿No tienes cuenta? Regístrate</a>
                <a href="#">¿Olvidaste tu contraseña?</a>
                <div class="checkbox-button-container">
                    <button class="btn" type="submit">Iniciar sesión</button>
                    <div class="checkbox-group">
                        <input class="form-check-input" type="checkbox" id="rememberMe" name="rememberMe">
                        <label class="form-check-label" for="rememberMe">Recuérdame</label>
                    </div>
                </div>
                <div class="google-divider"><span>o continuar con</span></div>
                <div id="g_id_onload"
                     data-client_id="69679398129-l7nfc1sp54l7qiomhfol99rkutjh6coe.apps.googleusercontent.com"
                     data-callback="handleGoogleLogin">
                </div>
                <div class="g_id_signin"
                     data-type="standard"
                     data-theme="outline"
                     data-text="signin_with"
                     data-locale="es">
                </div>
            </form>
        </div>

        <div class="container-form register-panel">
            <h2>Registrarse</h2>
            <form id="registerForm">
                <div class="container-input">
                    <ion-icon name="person-outline"></ion-icon>
                    <input type="number" id="reg-register" name="register" required placeholder="Registro">
                </div>
                <div class="container-input">
                    <ion-icon name="mail-outline"></ion-icon>
                    <input type="email" id="reg-email" name="email" required placeholder="Email">
                </div>
                <div class="container-input">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                    <input type="password" id="reg-password" name="password" required placeholder="Contraseña">
                    <div class="seePsw">
                     <ion-icon name="eye-outline" class="iconOpen"></ion-icon>
                     <ion-icon name="eye-off-outline" class="iconClose"></ion-icon>
                    </div>
                </div>
                <a href="#" id="go-login">¿Ya tienes cuenta? Inicia Sesión</a>
                <button class="btn" type="submit">Registrarse</button>
            </form>
        </div>
    </div>
    <div id="login-alert" class="alert">
    <span class="closebtn" onclick="this.parentElement.style.display='none';"></span>
    <strong id="login-alert-text">Error:</strong>
    </div>

    <div id="register-alert" class="alert">
    <span class="closebtn" onclick="this.parentElement.style.display='none';"></span>
    <strong id="register-alert-text">Error:</strong>
    </div>

    <!-- Modal: completar registro con Google -->
    <div id="google-registro-modal" class="modal-overlay">
        <div class="modal-box">
            <h3>Un paso más</h3>
            <p>Ingresa tu número de registro escolar para continuar.</p>
            <div class="container-input">
                <ion-icon name="school-outline"></ion-icon>
                <input type="number" id="modal-registro" placeholder="Número de registro">
            </div>
            <button type="button" id="modal-submit">Continuar</button>
            <p id="modal-error" class="modal-error"></p>
        </div>
    </div>

    <script src="/alumno/script_alumno.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

</body>
</html>
