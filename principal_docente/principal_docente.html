<!DOCTYPE html>
<html lang="es">
<head>
<title>Pagina principal del docente</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style_pDocente.css">
<style>

</style>
</head>
<body>
  <header>
    <div class="left">
      <div class="brand">
        <img src="simsLogo.png" alt="simslogo" class="logo">
        <span class="name">SIMCETI</span>
      </div>
    </div>
    <div class="right">
        <a href="#" title="Notificaciones" class="ionicon_a">
          <ion-icon name="notifications-outline"></ion-icon>
        </a>
        <a href="#">
          <img src="avatar.png" alt="Avatar" class="avatar">
        </a>
    </div>
  </header>

  <aside class="sidebar menu-toggle" id="sidebar">
    <nav>
      <ul>
        <li><a href="#dashboard">
          <ion-icon name="home-outline"></ion-icon>
          <span>Dashboard</span></a></li>
        <li><a href="#cursos">
          <ion-icon name="book-outline"></ion-icon>
          <span>Mis Cursos</span></a></li>
        <li><a href="#tareas">
          <ion-icon name="checkbox-outline"></ion-icon>
          <span>Tareas</span></a></li>
        <li><a href="#calificaciones">
          <ion-icon name="document-text-outline"></ion-icon>
          <span>Calificaciones</span></a></li>
        <li><a href="#horario">
          <ion-icon name="calendar-outline"></ion-icon>
          <span>Horario</span></a></li>
        <li><a href="#mensajes">
          <ion-icon name="mail-outline"></ion-icon>
          <span>Mensajes</span></a></li>
        <li><a href="#recursos">
          <ion-icon name="cloud-download-outline"></ion-icon>
          <span>Recursos</span></a></li>
      </ul>
    </nav>
    <div class="sidebar-footer">
      <a href="#perfil"><ion-icon name="person-outline"></ion-icon><span>Mi Perfil</span></a>
      <a href="#logout"><ion-icon name="log-out-outline"></ion-icon><span>Cerrar Sesión</span></a>
    </div>
  </aside>

  <div class="content">
    <h1>Bienvenido, [Nombre del Docente]</h1>
  </div>

<script src="script.pDocente.js"></script>
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
